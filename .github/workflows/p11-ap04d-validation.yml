name: P11 AP-04.4 validation

on:
  push:
    branches: [work/p11-ap02a-demo-bereinigung]
  pull_request:
    branches: [work/p11-ap02a-demo-bereinigung]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pglite-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            supabase/tests/package-lock.json
            KGV.Web/package-lock.json
      - name: Run isolated PGlite regressions
        run: |
          npm ci --prefix supabase/tests
          npm test --prefix supabase/tests
      - name: Build Web production bundle
        run: |
          npm ci --prefix KGV.Web
          npm run build --prefix KGV.Web
      - name: Publish test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-ap04d-pglite-and-web-logs
          path: |
            supabase/tests
            KGV.Web/dist
          if-no-files-found: warn
          retention-days: 7

  local-supabase-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - name: Install PDF E2E dependencies
        run: npm ci --prefix supabase/tests
      - name: Install PDF QA tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - uses: supabase/setup-cli@v1
        with:
          # config.toml is maintained with the repository's pinned 2.83 CLI.
          # Newer CLIs reject its supported [inbucket] section before startup.
          version: 2.83.0
      - name: Start isolated AP-04.4 Supabase stack
        # The E2E needs PostgreSQL, Auth/API, Storage and Edge Runtime only.
        # Excluding unrelated services reduces memory use, without suppressing
        # health checks for any service in the tested contract path.
        run: supabase start -x studio,logflare,vector,realtime,imgproxy,mailpit,postgres-meta,supavisor
      - name: Rebuild local-only database
        run: supabase db reset --local
      - name: Verify AP-01 local seed catalog
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (select count(*) from public.p11_ap01_test_fixture) <> 8 then
              raise exception 'AP-01 fixture catalog must contain exactly eight entries';
            end if;
          end $$;
          SQL
      - name: Execute P11 AP-04 SQL fixtures
        shell: bash
        run: |
          set -euo pipefail
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for fixture in \
            supabase/tests/20261113120000_p11_ap04a_lease_end_membership_status_funktionstest.sql \
            supabase/tests/20261113131000_p11_ap04b_aftercare_funktionstest.sql \
            supabase/tests/20261113140000_p11_ap04c_tenant_change_funktionstest.sql \
            supabase/tests/20261113150000_p11_ap04d_contract_change_funktionstest.sql; do
            psql "$db_url" -v ON_ERROR_STOP=1 -f "$fixture"
          done
      - name: P11-T07-P – Real signed lease amendment E2E
        shell: bash
        # This file is deliberately not discovered by the generic node:test
        # run: it requires the locally rebuilt PostgreSQL/Supabase stack.
        run: P11_LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" node supabase/tests/p11-ap04d-signed-change.e2e.mjs
      - name: CX-01 – Real local signature workflow E2E
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          P11_LOCAL_API_URL="$API_URL" \
          P11_LOCAL_ANON_KEY="$ANON_KEY" \
          P11_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          P11_LOCAL_DB_URL="$DB_URL" \
          CX01_RESULT_PATH="p11-ap04d-diagnostics/cx01-results.json" \
          node supabase/tests/cx01-signature-workflow.e2e.mjs
      - name: CX-02 – Real signed lease PDF E2E
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          P11_LOCAL_API_URL="$API_URL" \
          P11_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          P11_LOCAL_DB_URL="$DB_URL" \
          CX01_RESULT_PATH="p11-ap04d-diagnostics/cx01-results.json" \
          CX02_PDF_PATH="p11-ap04d-diagnostics/cx02-signed-lease.pdf" \
          CX02_RESULT_PATH="p11-ap04d-diagnostics/cx02-results.json" \
          node supabase/tests/cx02-signed-lease-pdf.e2e.mjs
          pdfinfo p11-ap04d-diagnostics/cx02-signed-lease.pdf | tee p11-ap04d-diagnostics/cx02-pdfinfo.txt
          pdftotext -layout p11-ap04d-diagnostics/cx02-signed-lease.pdf p11-ap04d-diagnostics/cx02-signed-lease.txt
          node supabase/tests/cx02-pdf-text-qa.mjs p11-ap04d-diagnostics/cx02-signed-lease.txt p11-ap04d-diagnostics/cx02-results.json
          pdftoppm -f 3 -singlefile -png -r 144 p11-ap04d-diagnostics/cx02-signed-lease.pdf p11-ap04d-diagnostics/cx02-page-3
      - name: Capture local Supabase diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p p11-ap04d-diagnostics
          docker ps -a --no-trunc > p11-ap04d-diagnostics/docker-ps.txt
          docker stats --no-stream > p11-ap04d-diagnostics/docker-stats.txt || true
          docker inspect $(docker ps -aq) --format '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' > p11-ap04d-diagnostics/docker-state.txt || true
          docker logs supabase_db_03_Arbeitsstand > p11-ap04d-diagnostics/postgres.log 2>&1 || true
      - name: Publish AP-04.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-ap04d-local-supabase-diagnostics
          path: p11-ap04d-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
