<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KGV Verwaltung – offline</title>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;box-sizing:border-box;background:#f6f7f1;color:#263024;font-family:Arial,sans-serif}.card{max-width:32rem;padding:2rem;border:1px solid #d9decf;border-radius:1rem;background:#fff;box-shadow:0 1rem 3rem #26302418}.mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.7rem;background:#b7ba5a;color:#fff;font-weight:800;font-size:1.3rem}h1{margin:1rem 0 .5rem}p{line-height:1.55;color:#596355}</style>
  </head>
  <body><main class="card"><div class="mark">K</div><h1>Keine Verbindung</h1><p>Für Vereinsdaten, Anmeldung und Dokumente wird eine Internetverbindung benötigt. Sobald die Verbindung wieder besteht, kannst du die KGV Verwaltung erneut öffnen.</p></main></body>
</html>
